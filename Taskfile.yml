version: '3'

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'

tasks:
  dev:
    desc: Run the native desktop app
    cmds:
      - go run .
  build:
    desc: Build the native app for this platform
    cmds:
      - go build -trimpath -ldflags "-s -w" -o bin/domiso-universal{{.EXE}} .
  test:
    cmds:
      - go test ./...
      - go vet ./...
  run:
    deps: [build]
    cmds:
      - ./bin/domiso-universal{{.EXE}}
  package:
    deps: [build]
    cmds:
      - cmd: powershell -NoProfile -Command "Compress-Archive -LiteralPath bin/domiso-universal.exe -DestinationPath bin/domiso-windows-amd64.zip -Force"
        platforms: [windows]
      - cmd: tar -czf bin/domiso-linux-amd64.tar.gz -C bin domiso-universal
        platforms: [linux]
